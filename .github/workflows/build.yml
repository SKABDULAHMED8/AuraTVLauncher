name: Build Aura Launcher

on:
  push:
    branches:
      - main
      - feature/aura-v1.1.0-tv-customization
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK (branch pushes, pull requests, manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle assembleDebug --no-daemon

      - name: Validate release signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore permanent release keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aura-release.jks"
          test -s "$RUNNER_TEMP/aura-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/aura-release.jks" -storepass "$RELEASE_STORE_PASSWORD" >/dev/null

      - name: Build permanently signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/aura-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AuraLauncher-debug.apk

      - name: Prepare signed release and checksum
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AuraLauncher-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum "AuraLauncher-${GITHUB_REF_NAME}.apk" > "AuraLauncher-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload debug build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-debug-apk
          path: dist/AuraLauncher-debug.apk

      - name: Upload signed release build artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AuraLauncher-release-apk
          path: dist/*

      - name: Create draft GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Aura Launcher ${{ github.ref_name }}
          files: |
            dist/AuraLauncher-${{ github.ref_name }}.apk
            dist/AuraLauncher-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
