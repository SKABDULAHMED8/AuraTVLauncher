name: Dev checks

# Quality gates for pull requests. This workflow uses NO secrets and read-only permissions.
# The signed release flow stays in build.yml, which this file never touches.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Signing tripwire
        run: python3 scripts/signing_tripwire.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unit tests and lint (debug)
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest lintDebug --no-daemon --console=plain > gradle-out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E '^e: |FAILED|What went wrong|error:|Execution failed' -A2 gradle-out.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::${msg}"
          fi
          exit $rc

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
